services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openclips
      POSTGRES_PASSWORD: openclips
      POSTGRES_DB: openclips
    ports: ["${OPENCLIPS_POSTGRES_HOST_PORT:-5432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclips -d openclips"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["${OPENCLIPS_REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    env_file: .env
    environment:
      OPENCLIPS_DATABASE_URL: postgresql+psycopg://openclips:openclips@db:5432/openclips
      OPENCLIPS_REDIS_URL: redis://redis:6379/0
    volumes:
      - media-data:/data/media
      - model-cache:/root/.cache/huggingface:ro
    ports: ["${OPENCLIPS_API_HOST_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    build: .
    env_file: .env
    environment:
      OPENCLIPS_DATABASE_URL: postgresql+psycopg://openclips:openclips@db:5432/openclips
      OPENCLIPS_REDIS_URL: redis://redis:6379/0
    volumes:
      - media-data:/data/media
      - model-cache:/root/.cache/huggingface
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["openclips-worker"]
volumes:
  postgres-data:
  media-data:
  model-cache:
