name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      # The studio pipeline's own runtime dependencies are heavy (CTranslate2,
      # OpenCV) and imported lazily, so only the ones needed to import and test
      # it are installed: Pillow draws the captions and thumbnails.
      - run: pip install pillow
      - run: pytest -q
      - run: ruff check src tests
      - run: mypy src
