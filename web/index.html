<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenClips Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0C;
    --card: #131317;
    --muted: #1A1A1F;
    --fg: #ECECEE;
    --muted-fg: #8A8A94;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.16);
    --primary: #ECECEE;
    --on-primary: #0A0A0C;
    --accent: #C89B4A;
    --accent-soft: rgba(200,155,74,.12);
    --destructive: #E5534B;
    --ring: rgba(255,255,255,.40);
    --r: 10px;
    --t: 180ms cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    background: rgba(10,10,12,.86); backdrop-filter: blur(12px);
  }
  .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
          background: var(--muted); border: 1px solid var(--border-strong); flex: none; }
  .mark svg { width: 16px; height: 16px; color: var(--fg); }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted-fg); font-size: 13px; }
  .source { margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
            font-size: 12.5px; color: var(--muted-fg); text-decoration: none;
            padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border);
            transition: color var(--t), border-color var(--t); }
  .source:hover { color: var(--fg); border-color: var(--border-strong); }
  .source svg { width: 14px; height: 14px; }
  main { max-width: 1360px; margin: 0 auto; padding: 26px 28px 90px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
  .controls { display: grid; grid-template-columns: minmax(280px,1fr) repeat(4, max-content) max-content; gap: 14px; align-items: end; }
  .field { min-width: 0; }
  label { display: block; font-size: 11px; font-weight: 500; letter-spacing: .06em;
          text-transform: uppercase; color: var(--muted-fg); margin-bottom: 7px; }
  input, select {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px;
    font: inherit; font-size: 14px; transition: border-color var(--t), box-shadow var(--t);
  }
  select { cursor: pointer; }
  input:hover, select:hover { border-color: var(--border-strong); }
  input:focus, select:focus { outline: none; border-color: var(--border-strong); box-shadow: 0 0 0 3px rgba(255,255,255,.07); }
  input::placeholder { color: #5C5C66; }

  button {
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    border: 0; border-radius: 9px; padding: 12px 22px;
    background: var(--primary); color: var(--on-primary);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    transition: background var(--t), transform var(--t), opacity var(--t);
  }
  button:hover:not(:disabled) { background: #FFFFFF; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button svg { width: 16px; height: 16px; }

  /* ---- progress ---- */
  .progress { margin-top: 22px; display: none; }
  .progress.on { display: block; }
  .steps { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .step { flex: 1 1 130px; display: flex; align-items: center; gap: 9px;
          padding: 10px 12px; border-radius: 10px; background: var(--muted);
          border: 1px solid transparent; transition: border-color var(--t), background var(--t); }
  .step .dot { width: 21px; height: 21px; border-radius: 50%; flex: none; display: grid; place-items: center;
               background: rgba(255,255,255,.08); color: var(--muted-fg); font-size: 11px; font-weight: 600; }
  .step .label { font-size: 13px; color: var(--muted-fg); font-weight: 500; }
  .step[data-state="active"] { border-color: var(--accent); background: var(--accent-soft); }
  .step[data-state="active"] .dot { background: var(--accent); color: #0A0A0C; }
  .step[data-state="active"] .label { color: var(--fg); }
  .step[data-state="done"] .dot { background: rgba(255,255,255,.09); color: var(--accent); }
  .step[data-state="done"] .label { color: var(--fg); }
  .step .dot svg { width: 12px; height: 12px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { display: flex; justify-content: space-between; gap: 16px; font-size: 13px;
            color: var(--muted-fg); margin-bottom: 9px; }
  .status .pct { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { height: 6px; background: var(--muted); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0;
             background: var(--accent);
             transition: width 600ms cubic-bezier(.4,0,.2,1); }
  .err { margin-top: 12px; padding: 11px 13px; border-radius: 9px; font-size: 13px;
         color: #F0908A; background: rgba(229,83,75,.09); border: 1px solid rgba(229,83,75,.26);
         white-space: pre-wrap; word-break: break-word; max-height: 190px; overflow: auto; }

  .jobs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .chip { background: var(--muted); color: var(--muted-fg); border: 1px solid var(--border);
          font-weight: 500; font-size: 13px; padding: 7px 13px; border-radius: 999px; }
  .chip:hover { background: var(--muted); border-color: var(--border-strong); color: var(--fg); }
  .chip[aria-current="true"] { border-color: var(--accent); color: var(--fg); }

  /* ---- results ---- */
  .results-head { display: none; align-items: center; justify-content: space-between;
                  gap: 16px; margin-top: 32px; flex-wrap: wrap; }
  .results-head.on { display: flex; }
  .results-head h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .results-head .sub { color: var(--muted-fg); font-size: 13px; font-weight: 400; margin-left: 8px; }
  .dl-all { display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
            font-size: 13px; font-weight: 500; padding: 9px 16px; border-radius: 9px;
            background: var(--muted); border: 1px solid var(--border); color: var(--fg);
            cursor: pointer; transition: border-color var(--t), background var(--t); }
  .dl-all:hover { border-color: var(--border-strong); background: #202027; }
  .dl-all svg { width: 15px; height: 15px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px,1fr)); gap: 20px; margin-top: 18px; }
  .clip { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
          overflow: hidden; display: flex; flex-direction: column;
          transition: border-color var(--t), transform var(--t); }
  .clip:hover { border-color: var(--border-strong); }
  .clip video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; }
  .posted-still { width: 100%; aspect-ratio: 9/16; background: #000 center/cover no-repeat;
                  display: grid; place-items: end center; padding-bottom: 14px; position: relative; }
  .posted-still::after { content: ''; position: absolute; inset: 0;
                         background: linear-gradient(transparent 55%, rgba(0,0,0,.75)); }
  .posted-badge { position: relative; z-index: 1; font-size: 11px; font-weight: 500;
                  padding: 4px 11px; border-radius: 999px; color: #7FB069;
                  background: rgba(10,10,12,.8); border: 1px solid rgba(127,176,105,.35); }
  .store { display: flex; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
  .store b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; }
  .bars { display: flex; height: 7px; border-radius: 999px; overflow: hidden;
          background: var(--muted); margin: 12px 0 9px; }
  .bars i { display: block; }
  .bars .m { background: var(--accent); }
  .bars .c { background: var(--muted-fg); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted-fg); }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 8px; height: 8px; border-radius: 2px; display: block; }
  .meta { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.4; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; color: var(--muted-fg); background: var(--muted);
         border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px;
         font-variant-numeric: tabular-nums; }
  .tag.score { color: var(--accent); border-color: rgba(200,155,74,.28); background: var(--accent-soft); }
  .dl { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 7px;
        text-decoration: none; font-size: 13px; font-weight: 500; padding: 9px;
        border-radius: 8px; background: var(--muted); border: 1px solid var(--border); color: var(--fg);
        transition: border-color var(--t), background var(--t); }
  .dl:hover { border-color: var(--border-strong); background: #202027; }
  .dl svg { width: 14px; height: 14px; }


  /* Publishing */
  .pub { margin-top: 36px; }
  .pub-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  .pub-head h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
  .pub-head .sub { color: var(--muted-fg); font-size: 13px; }
  .pub-grid { display: grid; grid-template-columns: minmax(0,352px) minmax(0,1fr); gap: 20px; align-items: start; }
  .pub-col { display: grid; gap: 20px; }
  .acct { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--muted);
            border: 1px solid var(--border-strong); flex: none; object-fit: cover; }
  .acct-name { font-weight: 600; font-size: 14px; }
  .acct-sub { color: var(--muted-fg); font-size: 12.5px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; font: inherit;
         font-size: 13px; font-weight: 500; padding: 9px 15px; border-radius: 9px; background: var(--muted);
         border: 1px solid var(--border); color: var(--fg); cursor: pointer; white-space: nowrap;
         transition: border-color var(--t), background var(--t); }
  .btn:hover { border-color: var(--border-strong); background: #202027; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.primary { background: var(--primary); color: var(--on-primary); border-color: transparent; }
  .btn.primary:hover { background: #fff; }
  .btn.ghost { background: transparent; }
  .btn.ghost:hover { color: var(--destructive); border-color: rgba(229,83,75,.36); background: transparent; }
  .note { font-size: 12.5px; line-height: 1.55; color: var(--muted-fg); background: var(--muted);
          border: 1px solid var(--border); border-left: 2px solid var(--accent);
          border-radius: 8px; padding: 10px 12px; }
  .note b { color: var(--fg); font-weight: 600; }
  .note code { font-size: 11.5px; background: var(--bg); padding: 1px 5px; border-radius: 4px;
               overflow-wrap: anywhere; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .rule { height: 1px; background: var(--border); margin: 15px 0; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--muted);
                 border: 1px solid var(--border-strong); transition: background var(--t); pointer-events: none; }
  .switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px;
                        border-radius: 50%; background: var(--muted-fg);
                        transition: transform var(--t), background var(--t); }
  .switch input:checked + span { background: var(--accent-soft); border-color: rgba(200,155,74,.5); }
  .switch input:checked + span::after { transform: translateX(16px); background: var(--accent); }
  .switch input:focus-visible + span { outline: 2px solid var(--ring); outline-offset: 2px; }
  .slots { display: flex; flex-wrap: wrap; gap: 8px; }
  .slot { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--border);
          border-radius: 8px; padding: 3px 3px 3px 10px; }
  .slot input { width: 78px; border: none; background: transparent; padding: 5px 0; font-size: 13px;
                font-variant-numeric: tabular-nums; }
  .slot input:focus { outline: none; }
  .slot button { background: none; border: none; color: var(--muted-fg); cursor: pointer;
                 padding: 3px 6px; border-radius: 5px; line-height: 1; font-size: 15px; }
  .slot button:hover { color: var(--destructive); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 11px; }
  .preset { font: inherit; font-size: 12px; padding: 5px 10px; border-radius: 7px;
            background: transparent; border: 1px solid var(--border); color: var(--muted-fg);
            cursor: pointer; transition: color var(--t), border-color var(--t); }
  .preset:hover { color: var(--fg); border-color: var(--border-strong); }
  .hours { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; }
  .hour { aspect-ratio: 1; border-radius: 6px; border: 1px solid var(--border);
          background: var(--bg); color: var(--muted-fg); font: inherit; font-size: 11px;
          display: grid; place-items: center; cursor: pointer; padding: 0;
          font-variant-numeric: tabular-nums;
          transition: background var(--t), border-color var(--t), color var(--t); }
  .hour:hover { border-color: var(--border-strong); color: var(--fg); }
  .hour[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent);
                               border-color: rgba(200,155,74,.55); font-weight: 600; }
  .hour-legend { display: flex; justify-content: space-between; font-size: 10.5px;
                 color: var(--muted-fg); margin-top: 5px; letter-spacing: .03em; }
  .slot-summary { font-size: 12.5px; color: var(--muted-fg); margin-top: 10px;
                  font-variant-numeric: tabular-nums; }
  .slot-summary b { color: var(--fg); font-weight: 500; }

  .qrow { display: grid; grid-template-columns: 44px minmax(0,1fr) max-content; gap: 13px;
          align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .qrow:last-child { border-bottom: none; padding-bottom: 0; }
  .qrow img, .qrow .noimg { width: 44px; height: 78px; border-radius: 6px; background: var(--muted);
                            object-fit: cover; border: 1px solid var(--border); }
  .qtitle { font-size: 13.5px; font-weight: 500; line-height: 1.4; overflow-wrap: anywhere;
            border-radius: 5px; padding: 1px 3px; margin-left: -3px; }
  .qtitle[contenteditable]:hover { background: var(--muted); }
  .qtitle[contenteditable]:focus { outline: 2px solid var(--ring); background: var(--muted); }
  .qmeta { font-size: 12px; color: var(--muted-fg); margin-top: 3px; overflow-wrap: anywhere; }
  .qnote { font-size: 12px; color: var(--accent); margin-top: 3px; overflow-wrap: anywhere; }
  .qerr { font-size: 12px; color: var(--destructive); margin-top: 3px; overflow-wrap: anywhere; }
  .qacts { display: flex; gap: 6px; align-items: center; }
  .done { margin-top: 6px; border-top: 1px solid var(--border); padding-top: 12px; }
  .done summary { font-size: 12.5px; color: var(--muted-fg); cursor: pointer; list-style: none; }
  .done summary::before { content: '\25B8'; display: inline-block; width: 14px;
                          transition: transform var(--t); }
  .done[open] summary::before { transform: rotate(90deg); }
  .done summary:hover { color: var(--fg); }
  .done-row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0 0 14px;
              font-size: 12.5px; color: var(--muted-fg); }
  .done-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .done-row a { color: var(--muted-fg); flex: none; }
  .done-row a:hover { color: var(--fg); }
  .pill { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 999px;
          border: 1px solid var(--border); background: var(--muted); color: var(--muted-fg);
          white-space: nowrap; font-variant-numeric: tabular-nums; }
  .pill.posted { color: #7FB069; border-color: rgba(127,176,105,.3); background: rgba(127,176,105,.1); }
  .pill.failed { color: var(--destructive); border-color: rgba(229,83,75,.3); background: rgba(229,83,75,.1); }
  .pill.uploading { color: var(--accent); border-color: rgba(200,155,74,.3); background: var(--accent-soft); }
  .icon-btn { background: none; border: 1px solid transparent; color: var(--muted-fg); cursor: pointer;
              border-radius: 7px; padding: 5px 8px; font: inherit; font-size: 12px; }
  .icon-btn:hover { color: var(--fg); border-color: var(--border); }
  @media (max-width: 900px) { .pub-grid { grid-template-columns: 1fr; } }

  .skeleton { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .skeleton .ph { aspect-ratio: 9/16; background: linear-gradient(100deg, var(--muted) 30%, #232329 50%, var(--muted) 70%);
                  background-size: 220% 100%; animation: sweep 1.5s linear infinite; }
  @keyframes sweep { to { background-position: -220% 0; } }

  .empty { text-align: center; padding: 72px 20px; color: var(--muted-fg); }
  .empty svg { width: 36px; height: 36px; margin-bottom: 14px; color: #3A3A42; }
  .empty h2 { font-size: 15px; font-weight: 600; color: var(--fg); margin: 0 0 6px; }
  .empty p { margin: 0; font-size: 14px; }

  @media (max-width: 1024px) { .controls { grid-template-columns: 1fr 1fr 1fr; } .controls .field:first-child { grid-column: 1 / -1; } .controls button { grid-column: 1 / -1; justify-content: center; } }
  @media (max-width: 768px) { main, header { padding-left: 18px; padding-right: 18px; } .controls { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .controls { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
  </span>
  <div>
    <h1>OpenClips Studio</h1>
    <p>Podcasts into postable vertical clips, on your own machine</p>
  </div>
  <!-- AGPL section 13: anyone reaching this over a network is entitled to the
       source of the version they are using, so the offer lives in the UI. -->
  <a class="source" href="https://github.com/hrithiksaini99/OpenClips"
     target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.4-.5-1.6.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.3v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3Z"/></svg>
    Source
  </a>
</header>

<main>
  <section class="card">
    <div class="controls">
      <div class="field">
        <label for="source">YouTube URL or local file path</label>
        <input id="source" placeholder="https://www.youtube.com/watch?v=… or /path/to/episode.mp4" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field"><label for="count">Clips</label>
        <select id="count"><option>8</option><option selected>12</option><option>16</option><option>20</option></select></div>
      <div class="field"><label for="model">Model</label>
        <select id="model">
          <option value="tiny">tiny · fastest</option><option value="base">base</option>
          <option value="small" selected>small · recommended</option><option value="medium">medium · best</option>
        </select></div>
      <div class="field"><label for="workers">Parallel</label>
        <select id="workers"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></div>
      <div class="field"><label for="ranker">Pick clips</label>
        <select id="ranker"><option value="llm" selected>AI ranked</option><option value="heuristic">Fast · no AI</option></select></div>
      <button id="go" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 2.6 7.3 7.9 1.4 8.7l4.3 4.2-1 5.9 5.2-2.8 5.3 2.8-1-5.9 4.3-4.2-5.9-.8Z"/><path d="M18 14v6"/><path d="M21 17h-6"/></svg>
        Generate clips
      </button>
    </div>

    <div class="progress" id="progress" aria-live="polite">
      <div class="steps" id="steps"></div>
      <div class="status"><span id="stage">Starting…</span><span class="pct" id="pct">0%</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barwrap"><i id="fill"></i></div>
      <div class="err" id="err" style="display:none"></div>
    </div>

    <div class="jobs" id="jobs"></div>
  </section>

  <div class="results-head" id="resultsHead">
    <h2>Clips<span class="sub" id="clipCount"></span></h2>
    <a class="dl-all" id="downloadAll" href="#" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
      Download all
    </a>
  </div>
  <div id="results" class="grid"></div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
    <h2>No clips yet</h2>
    <p>Paste a podcast link above and press Generate.</p>
  </div>

  <section class="pub">
    <div class="pub-head">
      <h2>Publishing</h2>
      <span class="sub" id="pubSummary"></span>
    </div>
    <div class="pub-grid">
      <div class="pub-col">
        <div class="card" id="acctCard"></div>
        <div class="card" id="schedCard"></div>
        <div class="card" id="storeCard"></div>
      </div>
      <div class="card" id="queueCard"></div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STEPS = [
  { key: 'download',   label: 'Download',   stages: ['resolve', 'download'] },
  { key: 'transcribe', label: 'Transcribe', stages: ['transcribe'] },
  { key: 'select',     label: 'Select',     stages: ['select'] },
  { key: 'render',     label: 'Render',     stages: ['render'] },
];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const YT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 17a24 24 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49 49 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24 24 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49 49 0 0 1-16.2 0A2 2 0 0 1 2.5 17"/><path d="m10 15 5-3-5-3z"/></svg>';
const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>';

let current = null, pollTimer = null, misses = 0, clipSignature = '', startedAt = 0;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
  return response.json();
}
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
// A job with no title yet is identified by its video id: "youtube.com/watch?"
// is the same for every one of them and says nothing.
function jobLabel(job) {
  const id = (job.source.match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/) || [])[1];
  const name = job.title || (id ? `Video ${id}` : job.source.slice(0, 34));
  if (job.status === 'error') return `${name} · failed`;
  if (job.status === 'running' || job.status === 'queued') return `${name} · working…`;
  return `${name} · ${job.clips.length} clip${job.clips.length === 1 ? '' : 's'}`;
}
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function paintSteps(job) {
  const done = job.status === 'done';
  let activeIndex = STEPS.findIndex((step) => step.stages.includes(job.stage));
  if (done) activeIndex = STEPS.length;
  $('steps').innerHTML = STEPS.map((step, index) => {
    const state = done || index < activeIndex ? 'done' : index === activeIndex ? 'active' : 'todo';
    const inner = state === 'done' ? CHECK : String(index + 1);
    return `<div class="step" data-state="${state}">
      <span class="dot">${inner}</span><span class="label">${step.label}</span></div>`;
  }).join('');
}

function renderClips(job) {
  const results = $('results');
  const rendering = job && job.stage === 'render' && job.status === 'running';
  const has = job && job.clips.length;
  $('empty').style.display = has || rendering ? 'none' : 'block';
  if (!job) { results.innerHTML = ''; clipSignature = ''; $('resultsHead').classList.remove('on'); return; }
  // The header doubles as the archive link, so it tracks the same job.
  $('resultsHead').classList.toggle('on', Boolean(has));
  if (has) {
    const total = job.clips.reduce((sum, c) => sum + c.duration, 0);
    $('clipCount').textContent = `${job.clips.length} clips · ${fmt(total)} total`;
    $('downloadAll').href = `/api/jobs/${job.id}/download`;
  }
  const signature = job.id + ':' + job.clips.map((c) => c.file + c.video_id).join(',') + ':' + rendering;
  if (signature === clipSignature) return;   // never rebuild mid-playback
  clipSignature = signature;
  const cards = job.clips.map((clip) => {
    // A posted clip is dropped from the job once its files are deleted, so this
    // branch only runs when the delete toggle is off and the file is still here.
    const posted = Boolean(clip.video_id);
    const media = posted
      ? `<div class="posted-still" style="background-image:url('/api/jobs/${job.id}/file/${clip.thumbnail}')">
           <span class="posted-badge">On YouTube</span></div>`
      : `<video controls preload="metadata" poster="/api/jobs/${job.id}/file/${clip.thumbnail}"
               src="/api/jobs/${job.id}/file/${clip.file}"></video>`;
    const action = posted
      ? `<a class="dl" href="https://youtu.be/${encodeURIComponent(clip.video_id)}"
           target="_blank" rel="noopener">${YT_ICON} Watch on YouTube</a>`
      : `<a class="dl" href="/api/jobs/${job.id}/file/${clip.file}" download>${DOWNLOAD_ICON} Download</a>`;
    return `<article class="clip">
      ${media}
      <div class="meta">
        <div class="title">${esc(clip.title)}</div>
        <div class="tags">
          <span class="tag">${fmt(clip.duration)}</span>
          <span class="tag">at ${fmt(clip.start)}</span>
          <span class="tag score">${clip.score.toFixed(0)}</span>
        </div>
        ${action}
      </div>
    </article>`;
  }).join('');
  // Skeletons stand in for clips still encoding, so the layout never jumps.
  const pending = rendering ? '<div class="skeleton"><div class="ph"></div></div>'.repeat(3) : '';
  results.innerHTML = cards + pending;
}

function paint(job) {
  const running = job.status === 'running' || job.status === 'queued';
  const percent = Math.round((job.progress || 0) * 100);
  $('progress').classList.add('on');
  const elapsed = startedAt && running ? ` · ${fmt((Date.now() - startedAt) / 1000)} elapsed` : '';
  $('stage').textContent = (job.message || job.stage) + elapsed;
  $('pct').textContent = percent + '%';
  $('fill').style.width = percent + '%';
  $('barwrap').setAttribute('aria-valuenow', percent);
  $('progress').setAttribute('aria-busy', running ? 'true' : 'false');
  $('err').style.display = job.status === 'error' ? 'block' : 'none';
  $('err').textContent = job.status === 'error' ? job.error : '';
  $('go').disabled = running;
  paintSteps(job);
  renderClips(job);
  return running;
}

// Self-scheduling loop: setInterval is throttled in background tabs, and a single
// failed fetch must not stop updates until the page is reloaded.
async function tick() {
  if (!current) return;
  try {
    const job = await api('/api/jobs/' + current);
    misses = 0;
    if (!paint(job)) { pollTimer = null; loadJobs(); return; }
  } catch (error) {
    if ((misses += 1) > 20) { pollTimer = null; $('err').style.display = 'block';
      $('err').textContent = 'Lost contact with the server.'; return; }
  }
  pollTimer = setTimeout(tick, misses ? 2000 : 1000);
}
async function poll(id) {
  current = id; misses = 0; startedAt = Date.now();
  clearTimeout(pollTimer); pollTimer = null;
  await tick();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && current && !pollTimer) tick();
});

async function loadJobs() {
  const jobs = await api('/api/jobs');
  $('jobs').innerHTML = jobs.map((job) => `
    <button type="button" class="chip" data-id="${job.id}" aria-current="${job.id === current}">
      ${esc(jobLabel(job))}
    </button>`).join('');
  $('jobs').querySelectorAll('button').forEach((button) => {
    button.onclick = async () => { clipSignature = ''; await poll(button.dataset.id); loadJobs(); };
  });
}

$('go').onclick = async () => {
  const source = $('source').value.trim();
  if (!source) { $('source').focus(); return; }
  $('go').disabled = true;
  $('err').style.display = 'none';
  try {
    const { id } = await api('/api/jobs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source, max_clips: +$('count').value, model: $('model').value,
        workers: +$('workers').value, use_llm: $('ranker').value === 'llm',
      }),
    });
    clipSignature = '';
    await poll(id);
    loadJobs();
  } catch (error) {
    $('err').style.display = 'block'; $('err').textContent = error.message;
    $('go').disabled = false;
  }
};
$('source').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });


// ---------------------------------------------------------------- publishing
let ytStatus = null, board = null, storage = null;
const gb = (bytes) => bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + ' GB'
  : bytes >= 1e6 ? Math.round(bytes / 1e6) + ' MB' : Math.round(bytes / 1e3) + ' KB';
const PRIVACY = ['private', 'unlisted', 'public'];
const PRESETS = [
  { label: 'Twice a day', hours: [9, 19] },
  { label: '3 a day', hours: [9, 15, 20] },
  { label: '5 a day', hours: [8, 11, 14, 17, 20] },
  { label: 'Evenings', hours: [17, 19, 21] },
];
const asSlot = (hour) => String(hour).padStart(2, '0') + ':00';
const hourLabel = (hour) => {
  const suffix = hour < 12 ? 'am' : 'pm';
  return `${hour % 12 || 12}${suffix}`;
};
function whenLabel(iso) {
  const at = new Date(iso);
  const today = new Date();
  const sameDay = at.toDateString() === today.toDateString();
  const day = sameDay ? 'today'
    : at.toLocaleDateString([], { weekday: 'short' });
  return `${day} ${hourLabel(at.getHours())}`;
}
// Listing every hour turned a 24-slot schedule into an unreadable paragraph.
function describeSlots(slots) {
  if (!slots.length) return 'Pick at least one time';
  const times = slots.map((time) => hourLabel(+time.split(':')[0]));
  const shown = times.slice(0, 5).join(', ');
  const rest = times.length - 5;
  const when = rest > 0 ? `${shown} and ${rest} more` : shown;
  return `<b>${slots.length} ${slots.length === 1 ? 'clip' : 'clips'} a day</b> — at ${when}`;
}

function showPubError(message) {
  const slot = $('pubSummary');
  slot.textContent = message;
  slot.style.color = 'var(--destructive)';
  setTimeout(() => { slot.style.color = ''; refreshPublishing(); }, 7000);
}

async function refreshPublishing() {
  try {
    const [status, queue, disk] = await Promise.all([
      api('/api/youtube/status'), api('/api/queue'), api('/api/storage')]);
    ytStatus = status; board = queue; storage = disk;
  } catch (error) { return; }   // the job poll loop already reports lost contact
  const failed = board.entries.filter((e) => e.status === 'failed').length;
  $('pubSummary').textContent = failed ? board.last_error : '';
  renderAccount(); renderSchedule(); renderStorage(); renderQueue();
}

async function connectYouTube() {
  try {
    const { url } = await api('/api/youtube/auth/start');
    window.open(url, '_blank', 'noopener');
    // Consent happens in the other tab; watch for it to land.
    const watch = setInterval(async () => {
      await refreshPublishing();
      if (ytStatus && ytStatus.connected) clearInterval(watch);
    }, 2500);
    setTimeout(() => clearInterval(watch), 300000);
  } catch (error) { showPubError(error.message); }
}

async function useClientFile(body) {
  try {
    ytStatus = await api('/api/youtube/client', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    renderAccount();
    connectYouTube();          // straight on to the consent screen
  } catch (error) { showPubError(error.message); }
}

function renderSetup(s) {
  const found = s.detected || [];
  $('acctCard').innerHTML = `
    <div><div class="acct-name">Connect YouTube</div>
    <div class="acct-sub">One-time setup, then it is a single click</div></div>
    <div class="rule"></div>
    ${found.length ? `
      <div class="note" style="border-left-color:#7FB069;margin-bottom:14px">
        Found this in your Downloads folder.</div>
      ${found.map((file, index) => `
        <div class="row" style="margin-bottom:10px">
          <div style="min-width:0">
            <div style="font-size:13px;font-weight:500;overflow-wrap:anywhere">${esc(file.name)}</div>
            <div class="acct-sub">${esc(file.kind)} client · ${esc(file.client_id)}</div>
          </div>
          <button class="btn primary" data-use="${index}">Use this</button>
        </div>`).join('')}
      <div class="rule"></div>` : ''}
    <ol style="margin:0;padding-left:19px;font-size:13px;line-height:1.9;color:var(--muted-fg)">
      <li><a href="https://console.cloud.google.com/projectcreate" target="_blank" rel="noopener">Create
        a Google Cloud project</a></li>
      <li><a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank"
        rel="noopener">Enable YouTube Data API v3</a></li>
      <li><a href="https://console.cloud.google.com/auth/branding" target="_blank" rel="noopener">Fill in
        the consent screen</a> and set it to <b style="color:var(--fg)">In production</b></li>
      <li><a href="https://console.cloud.google.com/apis/credentials/oauthclient" target="_blank"
        rel="noopener">Create an OAuth client</a> of type <b style="color:var(--fg)">Desktop app</b>,
        and download it</li>
    </ol>
    <div class="rule"></div>
    <div id="drop" style="border:1px dashed var(--border-strong);border-radius:9px;padding:16px;
      text-align:center;font-size:13px;color:var(--muted-fg);cursor:pointer">
      Drop the downloaded JSON here, or <span style="color:var(--fg)">choose a file</span>
    </div>
    <input type="file" id="clientFile" accept="application/json,.json" style="display:none" />`;

  $('acctCard').querySelectorAll('[data-use]').forEach((button) => {
    button.onclick = () => useClientFile({ path: found[+button.dataset.use].path });
  });
  const read = (file) => {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try { useClientFile({ payload: JSON.parse(reader.result) }); }
      catch (error) { showPubError('That file is not valid JSON'); }
    };
    reader.readAsText(file);
  };
  const drop = $('drop');
  drop.onclick = () => $('clientFile').click();
  $('clientFile').onchange = (event) => read(event.target.files[0]);
  drop.ondragover = (event) => { event.preventDefault(); drop.style.borderColor = 'var(--accent)'; };
  drop.ondragleave = () => { drop.style.borderColor = ''; };
  drop.ondrop = (event) => {
    event.preventDefault(); drop.style.borderColor = '';
    read(event.dataTransfer.files[0]);
  };
}

function renderAccount() {
  const s = ytStatus || {};
  if (!s.client_configured) { renderSetup(s); return; }
  if (!s.connected) {
    $('acctCard').innerHTML = `
      <div class="row"><div><div class="acct-name">YouTube account</div>
      <div class="acct-sub">Not connected</div></div>
      <button class="btn primary" id="connect">Connect &amp; start posting</button></div>`;
    $('connect').onclick = connectYouTube;
    return;
  }
  const channel = s.channel;
  $('acctCard').innerHTML = `
    <div class="acct">
      ${channel && channel.thumbnail
        ? `<img class="avatar" src="${esc(channel.thumbnail)}" alt="" />`
        : '<div class="avatar"></div>'}
      <div style="min-width:0;flex:1">
        <div class="acct-name">${esc(channel ? channel.title : 'Connected')}</div>
        <div class="acct-sub">Clips post to this channel</div>
      </div>
      <button class="btn ghost" id="disconnect">Disconnect</button>
    </div>
    ${s.error ? `<div class="rule"></div><div class="note">${esc(s.error)}</div>` : ''}`;
  $('disconnect').onclick = async () => {
    try { await api('/api/youtube/session', { method: 'DELETE' }); }
    catch (error) { showPubError(error.message); }
    refreshPublishing();
  };
}

function renderSchedule() {
  const schedule = (board && board.schedule) || {};
  const slots = schedule.slots || [];
  // The grid works in whole hours; a stored 09:30 lights up the 9 cell.
  const hours = new Set(slots.map((time) => parseInt(time.split(':')[0], 10)));
  const next = (board.entries || []).map((e) => e.scheduled_for).filter(Boolean).sort()[0];
  // "10 of 3 posted today" is what came of comparing a day's posts against a
  // limit that had since been lowered; past the limit it just says so.
  const today = board.posted_today >= board.daily_limit
    ? `Done for today (${board.posted_today} posted)`
    : `${board.posted_today} of ${board.daily_limit} posted today`;
  const paused = (board.paused_until || 0) * 1000 > Date.now();
  const state = paused
    ? `Waiting — the channel's daily upload limit was reached`
    : schedule.enabled ? `${today}${next ? ` · next ${whenLabel(next)}` : ''}` : 'Not running';
  $('schedCard').innerHTML = `
    <div class="row">
      <div><div class="acct-name">Schedule</div>
        <div class="acct-sub"${paused ? ' style="color:var(--accent)"' : ''}>${state}</div></div>
      <label class="switch" title="Arm the schedule">
        <input type="checkbox" id="armed" ${schedule.enabled ? 'checked' : ''} /><span></span></label>
    </div>
    <div class="rule"></div>
    <label>Post at</label>
    <div class="presets">
      ${PRESETS.map((preset, index) =>
        `<button type="button" class="preset" data-preset="${index}">${esc(preset.label)}</button>`).join('')}
    </div>
    <div class="hours" id="hours">
      ${[...Array(24).keys()].map((hour) => `<button type="button" class="hour" data-hour="${hour}"
        aria-pressed="${hours.has(hour)}" title="${hourLabel(hour)}">${hour}</button>`).join('')}
    </div>
    <div class="hour-legend"><span>midnight</span><span>noon</span><span>23:00</span></div>
    <div class="slot-summary">${describeSlots(slots)}</div>
    <div class="rule"></div>
    <div class="field"><label for="privacy">Visibility</label>
      <select id="privacy">${PRIVACY.map((level) =>
        `<option value="${level}" ${schedule.privacy === level ? 'selected' : ''}
        >${level[0].toUpperCase() + level.slice(1)}</option>`).join('')}</select></div>
    <div class="note" style="margin-top:13px">Until your Google Cloud project passes YouTube's API
      audit, everything uploaded through it is locked to <b>private</b>, whatever this is set to.</div>
    <div class="rule"></div>
    <div class="row"><div style="font-size:13px">Queue new clips automatically</div>
      <label class="switch"><input type="checkbox" id="autoq"
        ${schedule.auto_enqueue ? 'checked' : ''} /><span></span></label></div>`;

  const save = (changes) => api('/api/schedule', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes),
  }).then(refreshPublishing).catch((error) => showPubError(error.message));
  $('armed').onchange = (event) => save({ enabled: event.target.checked });
  $('autoq').onchange = (event) => save({ auto_enqueue: event.target.checked });
  $('privacy').onchange = (event) => save({ privacy: event.target.value });
  $('hours').querySelectorAll('[data-hour]').forEach((cell) => {
    cell.onclick = () => {
      const hour = +cell.dataset.hour;
      const next = new Set(hours);
      next.has(hour) ? next.delete(hour) : next.add(hour);
      if (!next.size) return;              // never leave the schedule with no times
      save({ slots: [...next].sort((a, b) => a - b).map(asSlot) });
    };
  });
  $('schedCard').querySelectorAll('[data-preset]').forEach((button) => {
    button.onclick = () => save({ slots: PRESETS[+button.dataset.preset].hours.map(asSlot) });
  });
}

function renderStorage() {
  const s = storage || { media: 0, clips: 0, total: 0, reclaimed: 0 };
  const share = (part) => s.total ? (part / s.total * 100).toFixed(1) : 0;
  $('storeCard').innerHTML = `
    <div class="row">
      <div><div class="acct-name">Storage</div>
        <div class="acct-sub">${s.reclaimed ? `${gb(s.reclaimed)} reclaimed so far` : 'Nothing reclaimed yet'}</div></div>
      <div class="store"><b>${gb(s.total)}</b></div>
    </div>
    <div class="bars">
      <i class="m" style="width:${share(s.media)}%"></i><i class="c" style="width:${share(s.clips)}%"></i>
    </div>
    <div class="legend">
      <span><i class="m" style="background:var(--accent)"></i>Sources ${gb(s.media)}</span>
      <span><i class="c" style="background:var(--muted-fg)"></i>Clips ${gb(s.clips)}</span>
    </div>
    <div class="rule"></div>
    <div class="row"><div style="font-size:13px;padding-right:8px">Delete the episode once clips are made
      <div class="acct-sub">Re-running it downloads the whole file again</div></div>
      <label class="switch"><input type="checkbox" id="delSrc"
        ${s.delete_source_after_render ? 'checked' : ''} /><span></span></label></div>
    <div class="rule"></div>
    <div class="row"><div style="font-size:13px;padding-right:8px">Delete a clip once it is posted
      <div class="acct-sub">It is on YouTube; the card clears from the grid</div></div>
      <label class="switch"><input type="checkbox" id="delClip"
        ${s.delete_clip_after_post ? 'checked' : ''} /><span></span></label></div>
    <div class="rule"></div>
    <div class="row"><div style="font-size:13px;padding-right:8px">Make custom thumbnails
      <div class="acct-sub">Needs a phone-verified channel · youtube.com/verify</div></div>
      <label class="switch"><input type="checkbox" id="thumbs"
        ${s.custom_thumbnails ? 'checked' : ''} /><span></span></label></div>`;
  const save = (changes) => api('/api/schedule', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(changes),
  }).then(refreshPublishing).catch((error) => showPubError(error.message));
  $('delSrc').onchange = (event) => save({ delete_source_after_render: event.target.checked });
  $('delClip').onchange = (event) => save({ delete_clip_after_post: event.target.checked });
  $('thumbs').onchange = (event) => save({ custom_thumbnails: event.target.checked });
}

function entryRow(entry) {
  const when = entry.scheduled_for
    ? new Date(entry.scheduled_for).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' })
    : '';
  const pill = { posted: 'Posted', failed: 'Failed', uploading: 'Uploading' }[entry.status]
    || when || 'Waiting';
  const klass = ['posted', 'failed', 'uploading'].includes(entry.status) ? entry.status : '';
  const thumb = entry.thumbnail
    ? `<img src="/api/jobs/${encodeURIComponent(entry.job_id)}/file/${encodeURIComponent(entry.thumbnail)}" alt="" />`
    : '<div class="noimg"></div>';
  const link = entry.video_id
    ? ` · <a href="https://youtu.be/${encodeURIComponent(entry.video_id)}" target="_blank"
         rel="noopener" style="color:var(--muted-fg)">youtu.be/${esc(entry.video_id)}</a>`
    : '';
  return `<div class="qrow">
    ${thumb}
    <div style="min-width:0">
      <div class="qtitle" data-edit="${entry.id}"
        ${entry.status === 'posted' ? '' : 'contenteditable="plaintext-only" spellcheck="false"'}
      >${esc(entry.title)}</div>
      <div class="qmeta">${esc((entry.hashtags || []).slice(0, 4).join(' '))}${link}</div>
      ${entry.error
        ? `<div class="${entry.status === 'posted' ? 'qnote' : 'qerr'}">${esc(entry.error)}</div>` : ''}
    </div>
    <div class="qacts">
      <span class="pill ${klass}">${esc(pill)}</span>
      ${['pending', 'failed'].includes(entry.status)
        ? `<button class="btn" data-publish="${entry.id}" style="padding:6px 12px">Publish now</button>` : ''}
      ${entry.status === 'posted' ? '' : `<button class="icon-btn" data-remove="${entry.id}">Remove</button>`}
    </div></div>`;
}

function renderQueue() {
  // Re-rendering under an open editor would throw away what is being typed.
  if ($('queueCard').contains(document.activeElement)) return;
  const entries = (board && board.entries) || [];
  const waiting = entries.filter((entry) => entry.status === 'pending').length;
  const posted = entries.filter((entry) => entry.status === 'posted').length;
  const live = entries.filter((entry) => entry.status !== 'posted');
  const done = entries.filter((entry) => entry.status === 'posted');
  const head = `<div class="row">
      <div><div class="acct-name">Queue</div><div class="acct-sub">${
        entries.length ? `${waiting} waiting · ${posted} posted` : 'Nothing queued'}</div></div>
      <div class="qacts">
        ${live.length ? `<button class="btn primary" id="publishAll">Publish all ${live.length}</button>` : ''}
        ${current ? '<button class="btn" id="queueJob">Queue these clips</button>' : ''}
      </div>
    </div><div class="rule"></div>`;
  $('queueCard').innerHTML = head + (entries.length
    ? live.map(entryRow).join('') + (done.length ? `
        <details class="done"${live.length ? '' : ' open'}>
          <summary>${done.length} already posted</summary>
          ${done.map((entry) => `<div class="done-row">
            <span>${esc(entry.title)}</span>
            <a href="https://youtu.be/${encodeURIComponent(entry.video_id)}" target="_blank"
               rel="noopener">youtu.be/${esc(entry.video_id)}</a>
          </div>`).join('')}
        </details>` : '')
    : `<div class="acct-sub">Clips get a title, description and hashtags written for them, then
       post at the times on the left. Titles here are editable.</div>`);

  if ($('publishAll')) $('publishAll').onclick = async () => {
    // Uploading a dozen videos to a real channel is worth one deliberate pause.
    const level = (board.schedule || {}).privacy || 'private';
    if (!confirm(`Post ${live.length} clips to YouTube now, as ${level}?`)) return;
    const button = $('publishAll');
    button.disabled = true; button.textContent = 'Uploading…';
    try { await api('/api/queue/publish-all', { method: 'POST' }); }
    catch (error) { showPubError(error.message); }
    refreshPublishing();
  };
  if ($('queueJob')) $('queueJob').onclick = async () => {
    const button = $('queueJob');
    button.disabled = true; button.textContent = 'Writing posts…';
    try { await api('/api/queue', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ job_id: current }),
    }); } catch (error) { showPubError(error.message); }
    setTimeout(refreshPublishing, 2000);
  };
  $('queueCard').querySelectorAll('[data-publish]').forEach((button) => {
    button.onclick = async () => {
      button.disabled = true; button.textContent = 'Uploading…';
      try { await api('/api/queue/' + button.dataset.publish + '/publish', { method: 'POST' }); }
      catch (error) { showPubError(error.message); }
      refreshPublishing();
    };
  });
  $('queueCard').querySelectorAll('[data-remove]').forEach((button) => {
    button.onclick = () => api('/api/queue/' + button.dataset.remove, { method: 'DELETE' })
      .then(refreshPublishing).catch((error) => showPubError(error.message));
  });
  $('queueCard').querySelectorAll('[data-edit][contenteditable]').forEach((cell) => {
    cell.onblur = async () => {
      const title = cell.textContent.trim();
      const entry = entries.find((item) => item.id === cell.dataset.edit);
      if (entry && title && title !== entry.title) {
        try { await api('/api/queue/' + cell.dataset.edit, {
          method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title }),
        }); } catch (error) { showPubError(error.message); }
      }
      refreshPublishing();
    };
    cell.onkeydown = (event) => { if (event.key === 'Enter') { event.preventDefault(); cell.blur(); } };
  });
}

(async function boot() {
  try {
    const jobs = await api('/api/jobs');
    await loadJobs();
    if (jobs.length) { await poll(jobs[0].id); await loadJobs(); }
  } catch (error) { setTimeout(boot, 2000); return; }
  await refreshPublishing();
  setInterval(refreshPublishing, 5000);
})();
</script>
