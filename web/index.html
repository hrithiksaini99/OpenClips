<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OpenClips Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0A0A0C;
    --card: #131317;
    --muted: #1A1A1F;
    --fg: #ECECEE;
    --muted-fg: #8A8A94;
    --border: rgba(255,255,255,.07);
    --border-strong: rgba(255,255,255,.16);
    --primary: #ECECEE;
    --on-primary: #0A0A0C;
    --accent: #C89B4A;
    --accent-soft: rgba(200,155,74,.12);
    --destructive: #E5534B;
    --ring: rgba(255,255,255,.40);
    --r: 10px;
    --t: 180ms cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    margin: 0; color: var(--fg);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; border-radius: 6px; }

  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    background: rgba(10,10,12,.86); backdrop-filter: blur(12px);
  }
  .mark { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
          background: var(--muted); border: 1px solid var(--border-strong); flex: none; }
  .mark svg { width: 16px; height: 16px; color: var(--fg); }
  h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted-fg); font-size: 13px; }
  main { max-width: 1360px; margin: 0 auto; padding: 26px 28px 90px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); padding: 20px; }
  .controls { display: grid; grid-template-columns: minmax(280px,1fr) repeat(4, max-content) max-content; gap: 14px; align-items: end; }
  .field { min-width: 0; }
  label { display: block; font-size: 11px; font-weight: 500; letter-spacing: .06em;
          text-transform: uppercase; color: var(--muted-fg); margin-bottom: 7px; }
  input, select {
    width: 100%; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 9px; padding: 11px 13px;
    font: inherit; font-size: 14px; transition: border-color var(--t), box-shadow var(--t);
  }
  select { cursor: pointer; }
  input:hover, select:hover { border-color: var(--border-strong); }
  input:focus, select:focus { outline: none; border-color: var(--border-strong); box-shadow: 0 0 0 3px rgba(255,255,255,.07); }
  input::placeholder { color: #5C5C66; }

  button {
    font: inherit; font-weight: 600; font-size: 14px; cursor: pointer;
    border: 0; border-radius: 9px; padding: 12px 22px;
    background: var(--primary); color: var(--on-primary);
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    transition: background var(--t), transform var(--t), opacity var(--t);
  }
  button:hover:not(:disabled) { background: #FFFFFF; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button svg { width: 16px; height: 16px; }

  /* ---- progress ---- */
  .progress { margin-top: 22px; display: none; }
  .progress.on { display: block; }
  .steps { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .step { flex: 1 1 130px; display: flex; align-items: center; gap: 9px;
          padding: 10px 12px; border-radius: 10px; background: var(--muted);
          border: 1px solid transparent; transition: border-color var(--t), background var(--t); }
  .step .dot { width: 21px; height: 21px; border-radius: 50%; flex: none; display: grid; place-items: center;
               background: rgba(255,255,255,.08); color: var(--muted-fg); font-size: 11px; font-weight: 600; }
  .step .label { font-size: 13px; color: var(--muted-fg); font-weight: 500; }
  .step[data-state="active"] { border-color: var(--accent); background: var(--accent-soft); }
  .step[data-state="active"] .dot { background: var(--accent); color: #0A0A0C; }
  .step[data-state="active"] .label { color: var(--fg); }
  .step[data-state="done"] .dot { background: rgba(255,255,255,.09); color: var(--accent); }
  .step[data-state="done"] .label { color: var(--fg); }
  .step .dot svg { width: 12px; height: 12px; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { display: flex; justify-content: space-between; gap: 16px; font-size: 13px;
            color: var(--muted-fg); margin-bottom: 9px; }
  .status .pct { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 600; }
  .bar { height: 6px; background: var(--muted); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0;
             background: var(--accent);
             transition: width 600ms cubic-bezier(.4,0,.2,1); }
  .err { margin-top: 12px; padding: 11px 13px; border-radius: 9px; font-size: 13px;
         color: #F0908A; background: rgba(229,83,75,.09); border: 1px solid rgba(229,83,75,.26);
         white-space: pre-wrap; word-break: break-word; max-height: 190px; overflow: auto; }

  .jobs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .chip { background: var(--muted); color: var(--muted-fg); border: 1px solid var(--border);
          font-weight: 500; font-size: 13px; padding: 7px 13px; border-radius: 999px; }
  .chip:hover { background: var(--muted); border-color: var(--border-strong); color: var(--fg); }
  .chip[aria-current="true"] { border-color: var(--accent); color: var(--fg); }

  /* ---- results ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(258px,1fr)); gap: 20px; margin-top: 30px; }
  .clip { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
          overflow: hidden; display: flex; flex-direction: column;
          transition: border-color var(--t), transform var(--t); }
  .clip:hover { border-color: var(--border-strong); }
  .clip video { width: 100%; aspect-ratio: 9/16; background: #000; display: block; }
  .meta { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { font-weight: 600; font-size: 14px; line-height: 1.4; }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; font-weight: 500; color: var(--muted-fg); background: var(--muted);
         border: 1px solid var(--border); padding: 3px 9px; border-radius: 999px;
         font-variant-numeric: tabular-nums; }
  .tag.score { color: var(--accent); border-color: rgba(200,155,74,.28); background: var(--accent-soft); }
  .dl { margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 7px;
        text-decoration: none; font-size: 13px; font-weight: 500; padding: 9px;
        border-radius: 8px; background: var(--muted); border: 1px solid var(--border); color: var(--fg);
        transition: border-color var(--t), background var(--t); }
  .dl:hover { border-color: var(--border-strong); background: #202027; }
  .dl svg { width: 14px; height: 14px; }

  .skeleton { background: var(--card); border: 1px solid var(--border); border-radius: var(--r); overflow: hidden; }
  .skeleton .ph { aspect-ratio: 9/16; background: linear-gradient(100deg, var(--muted) 30%, #232329 50%, var(--muted) 70%);
                  background-size: 220% 100%; animation: sweep 1.5s linear infinite; }
  @keyframes sweep { to { background-position: -220% 0; } }

  .empty { text-align: center; padding: 72px 20px; color: var(--muted-fg); }
  .empty svg { width: 36px; height: 36px; margin-bottom: 14px; color: #3A3A42; }
  .empty h2 { font-size: 15px; font-weight: 600; color: var(--fg); margin: 0 0 6px; }
  .empty p { margin: 0; font-size: 14px; }

  @media (max-width: 1024px) { .controls { grid-template-columns: 1fr 1fr 1fr; } .controls .field:first-child { grid-column: 1 / -1; } .controls button { grid-column: 1 / -1; justify-content: center; } }
  @media (max-width: 768px) { main, header { padding-left: 18px; padding-right: 18px; } .controls { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 420px) { .controls { grid-template-columns: 1fr; } .grid { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
  </span>
  <div>
    <h1>OpenClips Studio</h1>
    <p>Podcasts into postable vertical clips, on your own machine</p>
  </div>
</header>

<main>
  <section class="card">
    <div class="controls">
      <div class="field">
        <label for="source">YouTube URL or local file path</label>
        <input id="source" placeholder="https://www.youtube.com/watch?v=… or /path/to/episode.mp4" autocomplete="off" spellcheck="false" />
      </div>
      <div class="field"><label for="count">Clips</label>
        <select id="count"><option>8</option><option selected>12</option><option>16</option><option>20</option></select></div>
      <div class="field"><label for="model">Model</label>
        <select id="model">
          <option value="tiny">tiny · fastest</option><option value="base">base</option>
          <option value="small" selected>small · recommended</option><option value="medium">medium · best</option>
        </select></div>
      <div class="field"><label for="workers">Parallel</label>
        <select id="workers"><option>2</option><option selected>4</option><option>6</option><option>8</option></select></div>
      <div class="field"><label for="ranker">Pick clips</label>
        <select id="ranker"><option value="llm" selected>AI ranked</option><option value="heuristic">Fast · no AI</option></select></div>
      <button id="go" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 2.6 7.3 7.9 1.4 8.7l4.3 4.2-1 5.9 5.2-2.8 5.3 2.8-1-5.9 4.3-4.2-5.9-.8Z"/><path d="M18 14v6"/><path d="M21 17h-6"/></svg>
        Generate clips
      </button>
    </div>

    <div class="progress" id="progress" aria-live="polite">
      <div class="steps" id="steps"></div>
      <div class="status"><span id="stage">Starting…</span><span class="pct" id="pct">0%</span></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barwrap"><i id="fill"></i></div>
      <div class="err" id="err" style="display:none"></div>
    </div>

    <div class="jobs" id="jobs"></div>
  </section>

  <div id="results" class="grid"></div>
  <div class="empty" id="empty">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>
    <h2>No clips yet</h2>
    <p>Paste a podcast link above and press Generate.</p>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STEPS = [
  { key: 'download',   label: 'Download',   stages: ['resolve', 'download'] },
  { key: 'transcribe', label: 'Transcribe', stages: ['transcribe'] },
  { key: 'select',     label: 'Select',     stages: ['select'] },
  { key: 'render',     label: 'Render',     stages: ['render'] },
];
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
const DOWNLOAD_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>';

let current = null, pollTimer = null, misses = 0, clipSignature = '', startedAt = 0;

async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) throw new Error((await response.json()).detail || response.statusText);
  return response.json();
}
const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function paintSteps(job) {
  const done = job.status === 'done';
  let activeIndex = STEPS.findIndex((step) => step.stages.includes(job.stage));
  if (done) activeIndex = STEPS.length;
  $('steps').innerHTML = STEPS.map((step, index) => {
    const state = done || index < activeIndex ? 'done' : index === activeIndex ? 'active' : 'todo';
    const inner = state === 'done' ? CHECK : String(index + 1);
    return `<div class="step" data-state="${state}">
      <span class="dot">${inner}</span><span class="label">${step.label}</span></div>`;
  }).join('');
}

function renderClips(job) {
  const results = $('results');
  const rendering = job && job.stage === 'render' && job.status === 'running';
  const has = job && job.clips.length;
  $('empty').style.display = has || rendering ? 'none' : 'block';
  if (!job) { results.innerHTML = ''; clipSignature = ''; return; }
  const signature = job.id + ':' + job.clips.map((c) => c.file).join(',') + ':' + rendering;
  if (signature === clipSignature) return;   // never rebuild mid-playback
  clipSignature = signature;
  const cards = job.clips.map((clip) => `
    <article class="clip">
      <video controls preload="metadata" poster="/api/jobs/${job.id}/file/${clip.thumbnail}"
             src="/api/jobs/${job.id}/file/${clip.file}"></video>
      <div class="meta">
        <div class="title">${esc(clip.title)}</div>
        <div class="tags">
          <span class="tag">${fmt(clip.duration)}</span>
          <span class="tag">at ${fmt(clip.start)}</span>
          <span class="tag score">${clip.score.toFixed(0)}</span>
        </div>
        <a class="dl" href="/api/jobs/${job.id}/file/${clip.file}" download>${DOWNLOAD_ICON} Download</a>
      </div>
    </article>`).join('');
  // Skeletons stand in for clips still encoding, so the layout never jumps.
  const pending = rendering ? '<div class="skeleton"><div class="ph"></div></div>'.repeat(3) : '';
  results.innerHTML = cards + pending;
}

function paint(job) {
  const running = job.status === 'running' || job.status === 'queued';
  const percent = Math.round((job.progress || 0) * 100);
  $('progress').classList.add('on');
  const elapsed = startedAt && running ? ` · ${fmt((Date.now() - startedAt) / 1000)} elapsed` : '';
  $('stage').textContent = (job.message || job.stage) + elapsed;
  $('pct').textContent = percent + '%';
  $('fill').style.width = percent + '%';
  $('barwrap').setAttribute('aria-valuenow', percent);
  $('progress').setAttribute('aria-busy', running ? 'true' : 'false');
  $('err').style.display = job.status === 'error' ? 'block' : 'none';
  $('err').textContent = job.status === 'error' ? job.error : '';
  $('go').disabled = running;
  paintSteps(job);
  renderClips(job);
  return running;
}

// Self-scheduling loop: setInterval is throttled in background tabs, and a single
// failed fetch must not stop updates until the page is reloaded.
async function tick() {
  if (!current) return;
  try {
    const job = await api('/api/jobs/' + current);
    misses = 0;
    if (!paint(job)) { pollTimer = null; loadJobs(); return; }
  } catch (error) {
    if ((misses += 1) > 20) { pollTimer = null; $('err').style.display = 'block';
      $('err').textContent = 'Lost contact with the server.'; return; }
  }
  pollTimer = setTimeout(tick, misses ? 2000 : 1000);
}
async function poll(id) {
  current = id; misses = 0; startedAt = Date.now();
  clearTimeout(pollTimer); pollTimer = null;
  await tick();
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && current && !pollTimer) tick();
});

async function loadJobs() {
  const jobs = await api('/api/jobs');
  $('jobs').innerHTML = jobs.map((job) => `
    <button type="button" class="chip" data-id="${job.id}" aria-current="${job.id === current}">
      ${esc(job.title || job.source.slice(0, 30))} · ${job.clips.length} clips
    </button>`).join('');
  $('jobs').querySelectorAll('button').forEach((button) => {
    button.onclick = async () => { clipSignature = ''; await poll(button.dataset.id); loadJobs(); };
  });
}

$('go').onclick = async () => {
  const source = $('source').value.trim();
  if (!source) { $('source').focus(); return; }
  $('go').disabled = true;
  $('err').style.display = 'none';
  try {
    const { id } = await api('/api/jobs', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source, max_clips: +$('count').value, model: $('model').value,
        workers: +$('workers').value, use_llm: $('ranker').value === 'llm',
      }),
    });
    clipSignature = '';
    await poll(id);
    loadJobs();
  } catch (error) {
    $('err').style.display = 'block'; $('err').textContent = error.message;
    $('go').disabled = false;
  }
};
$('source').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

(async function boot() {
  try {
    const jobs = await api('/api/jobs');
    await loadJobs();
    if (jobs.length) { await poll(jobs[0].id); await loadJobs(); }
  } catch (error) { setTimeout(boot, 2000); }
})();
</script>
</body>
</html>
