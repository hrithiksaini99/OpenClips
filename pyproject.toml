[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclips"
version = "0.1.0"
description = "Self-hosted long-form video to short-form clips platform (foundation)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "yt-dlp>=2024.8",
    "python-multipart>=0.0.9",
]

[project.scripts]
openclips-api = "openclips.main:serve"
openclips-worker = "openclips.worker:run"

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "sqlalchemy[mypy]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "sqlalchemy[mypy]>=2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openclips"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require external services such as PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["openclips"]
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = ["alembic.*", "redis.*", "faster_whisper.*"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"src/openclips/api/routes.py" = ["B008"]
"src/openclips/api/publishing_routes.py" = ["B008"]
